name: Check theme

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint warnings are allowed (the one left is deliberate), errors fail
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build theme
        run: npm run build
