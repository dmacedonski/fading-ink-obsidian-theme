name: Release Obsidian theme

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The release carries manifest.json, so its version has to be the tag
      - name: Check version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag doesn't match version $version in manifest.json"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The same checks as on every push, so a release can't skip them
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # theme.css isn't committed, it's built from src/ and fonts/
      - name: Build theme
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # The notes are the version's entry in CHANGELOG.md, the release
          # stops here if there isn't one
          node scripts/release-notes.mjs "$tag" > release-notes.md

          gh release create "$tag" \
            --title="$tag" \
            --notes-file=release-notes.md \
            --draft \
            manifest.json theme.css
